name: Update Chicago Content

on:
  schedule:
    - cron: "17 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cityupdater-content
  cancel-in-progress: false

jobs:
  update-chicago:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Chicago pages
        run: python update_news.py

      - name: Commit and push updated pages
        run: |
          git config user.name "CityUpdater Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add chicago/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Chicago city content"

            git pull --rebase origin main

            git push origin main
          fi
